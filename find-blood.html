<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <meta name="keywords" content="">
    <title>Blood Link</title>
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet"> 
    <link href="css/bootstrap.min.css" rel="stylesheet" media="screen">
    <link href="css/slicknav.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/swiper-bundle.min.css">
    <link href="css/all.min.css" rel="stylesheet">
    <link href="css/animate.css" rel="stylesheet">
    <link href="css/magnific-popup.css" rel="stylesheet">
    <link href="css/custom.css" rel="stylesheet">
	<link href="css/responsive.css" rel="stylesheet">
</head>

<body>

	<header class="main-header">
		<div class="header-sticky">
			<nav class="navbar navbar-expand-lg">
				<div class="container">
					<a class="navbar-brand" href="/"><img src="images/logo.png" alt="BloodLink"></a>
						
					<div class="collapse navbar-collapse main-menu">
						<ul class="navbar-nav mr-auto" id="menu">
							<li class="nav-item"><a class="nav-link" href="/">Home</a></li>
							<li class="nav-item"><a class="nav-link" href="/about">About Us</a></li>
							<li class="nav-item"><a class="nav-link active" href="/find-blood">Find Blood</a></li>
							<li class="nav-item"><a class="nav-link" href="/admin"><i class="fa fa-user-shield me-1"></i> Admin</a></li>
						</ul>
					</div>
					<div class="navbar-toggle"></div>                        
				</div>
			</nav>
			<div class="responsive-menu"></div>
		</div>
	</header>
	
	<section class="find-blood-section">
		<div class="container">
			<div class="row">
				<div class="col-lg-5">
					<div class="back_btn">
						<a href="/"><i class="fa fa-arrow-left"></i> Back to Home</a>
					</div>
				</div>
			</div>
			<div class="row justify-content-center">
				<div class="col-lg-8">
					<div class="request_blood_block">
						<h2>Request Blood</h2>
						<p>Submit a blood request and we'll check availability across nearby hospitals.</p>
						<form action="/find-blood" method="POST">
						<input type="hidden" name="user_lat" id="user_lat">
						<input type="hidden" name="user_lon" id="user_lon">

						<div class="row mt-4">
							<div class="col-lg-12 mb-3">
								<label class="form-label">Required Blood Group: <span class="text-danger">*</span></label>
								<select name="blood_group" class="form-select" required>
									<option value="" disabled selected>Select Blood Group</option>
									<option value="A+">A+</option>
									<option value="A-">A-</option>
									<option value="B+">B+</option>
									<option value="B-">B-</option>
									<option value="AB+">AB+</option>
									<option value="AB-">AB-</option>
									<option value="O+">O+</option>
									<option value="O-">O-</option>
								</select>
							</div>
							<div class="col-lg-12">
								<div class="mb-4">
									<label class="form-label">
										Urgency Level <span class="text-danger">*</span>
									</label>
									<div class="urgency-option">
										<input type="radio" id="critical" name="urgency" value="Critical" class="urgency-radio" checked>
										<label for="critical" class="urgency-card">
											<div class="d-flex align-items-center">
												<span class="radio-circle"></span>
												<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-danger"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg>
												<div>
													<h6>Critical</h6>
													<small>Within 6 hours</small>
												</div>
											</div>
										</label>
									</div>
									<div class="urgency-option">
										<input type="radio" id="urgent" name="urgency" value="Urgent" class="urgency-radio">
										<label for="urgent" class="urgency-card">
											<div class="d-flex align-items-center">
												<span class="radio-circle"></span>
												<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-orange"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
												<div>
													<h6>Urgent</h6>
													<small>Within 24 hours</small>
												</div>
											</div>
										</label>
									</div>
									<div class="urgency-option">
										<input type="radio" id="planned" name="urgency" value="Planned" class="urgency-radio">
										<label for="planned" class="urgency-card">
											<div class="d-flex align-items-center">
												<span class="radio-circle"></span>
												<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg>
												<div>
													<h6>Planned</h6>
													<small>2+ days</small>
												</div>
											</div>
										</label>
									</div>
								</div>
								<div class="date_time mb-3">
									<div class="row">
										<div class="col-md-6">
											<label class="form-label">
												Date Needed
											</label>
											<div class="input-group">
												<input type="date" name="date_needed" class="form-control">
											</div>
										</div>
										<div class="col-md-6">
											<label class="form-label">
												Time Needed
											</label>
											<div class="input-group">
												<input type="time" name="time_needed" class="form-control">
											</div>
										</div>
									</div>
								</div>
							</div>
							<div class="col-md-6 mb-3">
								<label class="form-label">
									Your Location / Area <span class="text-danger">*</span>
								</label>
								<div class="input-group">
									<input type="text" name="location" id="userLocationInput" list="panvelAreasList" class="form-control" placeholder="e.g. New Panvel, Kharghar, Khanda Colony" required>
									<datalist id="panvelAreasList">
										<option value="New Panvel">
										<option value="Old Panvel">
										<option value="Khanda Colony">
										<option value="Kamothe">
										<option value="Kharghar">
										<option value="Kalamboli">
										<option value="Karanjade">
									</datalist>
								</div>
								<small class="form-note text-muted">Used to find closest hospitals with available stock.</small>
							</div>
							<div class="col-md-6 mb-3">
								<label class="form-label">
									Units of Blood Required
									<span class="text-danger">*</span>
								</label>
								<select name="units" class="form-select">
									<option value="1" selected>1 Unit</option>
									<option value="2">2 Units</option>
									<option value="3">3 Units</option>
									<option value="4">4 Units</option>
									<option value="5">5 Units</option>
								</select>
								<small class="form-note">
									Each unit is typically 500ml of whole blood
								</small>
							</div>
							<div class="col-md-12 mb-3">
								<div class="acknowledgement_card">
									<h4>Acknowledgement & Declaration</h4>	
									<div class="ack-wrapper">
										<input type="checkbox" id="acknowledgement" class="form-check-input custom-checkbox" required checked>
										<label for="acknowledgement" class="ack-content">
											<strong>Voluntary Blood Donation Compliance:</strong>
											I hereby declare and acknowledge in compliance with the Drugs and Cosmetics Act, 1940, and the National Blood Policy of India that this blood requirement is genuine and medically necessary.
										</label>
									</div>
								</div>
							</div>
							<div class="col-md-12 text-center">
								<button type="submit" class="btn submit_blood w-100 py-3" style="font-size: 17px; font-weight: 600;">
									Continue to Contact Details <i class="fa fa-arrow-right ms-2"></i>
								</button>
							</div>
						</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</section>

    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/jquery.slicknav.js"></script>
    <script src="js/swiper-bundle.min.js"></script>
    <script src="js/jquery.magnific-popup.min.js"></script>
    <script src="js/SmoothScroll.js"></script>
    <script src="js/gsap.min.js"></script>
	<script src="js/SplitText.js"></script>
    <script src="js/ScrollTrigger.min.js"></script>
    <script src="js/wow.js"></script>
    <script src="js/function.js"></script>
	
	<script>
		function addLoadEvent(func) {
				var oldonload = window.onload;
				if (typeof window.onload != 'function') {
					window.onload = func;
				} else {
					window.onload = function () {
						if (oldonload) {
							oldonload();
						}
					}
				}
			}
			addLoadEvent(setmenu('1'));
	</script>
	<script>
		const planned = document.getElementById("planned");
		const dateTime = document.querySelector(".date_time");

		document.querySelectorAll('input[name="urgency"]').forEach(radio => {
			radio.addEventListener("change", function () {
				if (planned.checked) {
					dateTime.style.display = "block";
				} else {
					dateTime.style.display = "none";
				}
			});
		});

		// Auto-populate coordinates if user enables geolocation
		if (navigator.geolocation) {
			navigator.geolocation.getCurrentPosition(function (position) {
				const latInput = document.getElementById("user_lat");
				const lonInput = document.getElementById("user_lon");
				if (latInput && lonInput) {
					latInput.value = position.coords.latitude;
					lonInput.value = position.coords.longitude;
				}
			}, function () {
				// Fallback to text location matching
			});
		}
	</script>
	
</body>
</html>
